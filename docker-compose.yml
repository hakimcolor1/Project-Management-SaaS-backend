# Optional local PostgreSQL for development and tests.
# Any PostgreSQL 14+ works – just point DATABASE_URL at it instead.
# Port 5433 avoids clashing with a natively installed PostgreSQL on 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: teamflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
      POSTGRES_DB: teamflow
    ports:
      - "5433:5432"
    volumes:
      - teamflow-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teamflow-pgdata:
